<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelas VIII.H - Jadwal, Piket, dan Struktur</title>
<meta name="description" content="Jadwal pelajaran, jadwal piket, dan struktur kelas VIII.H - SMP Negeri 1 Gunungputri">
<meta name="theme-color" content="#1f4d3a">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style nonce="__NONCE__">
:root{
  --hijau-tua:#12291c;
  --hijau:#1f4d3a;
  --hijau-muda:#2d6b4f;
  --emas:#e8b923;
  --bg:#f0f3ef;
  --teks:#132018;
  --muted:#4c6357;
  --border:#d3ddd4;
  --putih:#fffefa;
  --merah-logo:#e0392b;
  --kuning-logo:#f4c945;
  --biru-logo:#2f8fd6;
  --hijau-logo:#7ec24a;
  --radius:14px;
  --shadow-sm:0 1px 3px rgba(18,41,28,.08);
  --shadow-md:0 8px 24px -8px rgba(18,41,28,.28);
}
*{box-sizing:border-box}
html{scroll-padding-top:76px}
body{margin:0;font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--teks);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{background:linear-gradient(160deg,var(--hijau) 0%,var(--hijau-tua) 100%);color:var(--putih);padding:30px 0 22px;box-shadow:var(--shadow-md)}
.accent-bar{height:5px;background:linear-gradient(90deg,var(--merah-logo),var(--kuning-logo) 35%,var(--hijau-logo) 65%,var(--biru-logo));}
.header-inner{display:flex;align-items:center;gap:18px}
.logo{width:72px;height:72px;flex:none;border-radius:50%;background:var(--putih);padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
.brand{min-width:0}
.sekolah{margin:0;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.78}
h1{font-family:"Poppins",sans-serif;margin:2px 0 0;font-size:clamp(2.1rem,8vw,3.4rem);line-height:1;font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 0;font-size:.98rem;opacity:.88}
.status{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.22);border-left:4px solid var(--emas);font-weight:600;font-size:.95rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.tabs{display:flex;gap:8px;padding:12px 0;overflow-x:auto}
.tab,.chip{font:inherit;cursor:pointer;border:2px solid var(--hijau);background:var(--putih);color:var(--hijau);border-radius:999px;padding:9px 16px;font-weight:700;transition:background .15s ease,color .15s ease,transform .1s ease}
.tab{flex:1 0 auto;padding:9px 14px;text-align:center}
.tab[aria-selected="true"],.chip.on{background:var(--hijau);color:var(--putih)}
.tab:hover,.chip:hover{transform:translateY(-1px)}
.tab:focus-visible,.chip:focus-visible,.retry:focus-visible,.foto:focus-visible,.sos:focus-visible,.lbtn:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
main{padding:22px 0 44px;min-height:50vh}
h2{font-family:"Poppins",sans-serif;font-size:1.25rem;margin:0 0 14px;color:var(--judul)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip.today{box-shadow:inset 0 -4px 0 var(--emas)}
.blok{display:grid;grid-template-columns:108px 1fr;gap:14px;padding:14px 16px;border-radius:var(--radius);margin-bottom:10px;border:2px solid transparent;background:var(--putih);box-shadow:var(--shadow-sm);transition:box-shadow .15s ease}
.blok.now{border-color:var(--hijau-tua);box-shadow:0 0 0 3px var(--emas)}
.blok.rest{background:transparent;border:2px dashed #a9bcb0;color:var(--muted);padding:9px 16px;box-shadow:none}
.blok.kok{background:repeating-linear-gradient(135deg,#d3e4f5 0 12px,#f6dcae 12px 24px,#d9f0cb 24px 36px)}
.jam{font-variant-numeric:tabular-nums;font-weight:700;font-size:.88rem;opacity:.85}
.mp{font-weight:800;font-size:1.12rem;line-height:1.3;font-family:"Poppins",sans-serif}
.mp small{font-weight:600;font-size:.82rem;opacity:.75;margin-left:6px}
.guru{font-size:.9rem;opacity:.8}
.badge{display:inline-block;background:var(--hijau-tua);color:#fff;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 9px;margin-left:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--putih);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .15s ease,box-shadow .15s ease}
.card.on{border-color:var(--hijau);box-shadow:0 0 0 3px var(--emas)}
.card h3{margin:0 0 10px;font-size:1.02rem;font-family:"Poppins",sans-serif;color:var(--judul)}
.card ol{margin:0;padding-left:20px}
.card li{padding:3px 0}
.card ul{margin:0;padding:0;list-style:none}
.card ul li{padding:3px 0;border-bottom:1px solid var(--bg)}
.card ul li:last-child{border-bottom:none}
.wali{background:linear-gradient(135deg,var(--hijau),var(--hijau-tua));color:var(--putih);border-color:var(--hijau);margin-bottom:14px}
.wali h3{color:var(--putih);opacity:.85}
.wali .guru{font-size:1.15rem;font-weight:800;opacity:1}
.empty,.error{padding:22px;border-radius:var(--radius);background:var(--putih);border:2px dashed #a9bcb0;text-align:center}
.retry{font:inherit;font-weight:700;margin-top:10px;padding:9px 16px;border-radius:999px;border:2px solid var(--hijau);background:var(--hijau);color:#fff;cursor:pointer}
.galeri{column-width:190px;column-gap:12px}
.foto{display:block;width:100%;margin:0 0 12px;padding:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--putih);cursor:zoom-in;break-inside:avoid;box-shadow:var(--shadow-sm);transition:transform .15s ease}
.foto:hover{transform:translateY(-2px)}
.foto img{display:block;width:100%;height:auto}
.sosmed{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sos{display:block;padding:22px;border-radius:var(--radius);text-decoration:none;min-height:130px;box-shadow:var(--shadow-sm);transition:transform .15s ease,box-shadow .15s ease}
.sos:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.sos .nm{font-size:1.5rem;font-weight:800;line-height:1.1;font-family:"Poppins",sans-serif}
.sos .hd{margin-top:5px;opacity:.9}
.sos .go{margin-top:16px;font-weight:700;text-decoration:underline}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.94);display:flex;align-items:center;justify-content:center;padding:16px 16px 80px}
.lb img{max-width:100%;max-height:calc(100vh - 110px);border-radius:10px}
.lb-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;color:#fff;font-weight:600}
.lbtn{font:inherit;font-weight:700;cursor:pointer;border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:8px 14px}

@media (max-width:480px){.blok{grid-template-columns:1fr;gap:3px}.header-inner{gap:14px}.logo{width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ===== Musik (tab Kenangan) ===== */
.musik-btn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;color:#fff;background:rgba(18,41,28,.82);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 16px;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease}
.musik-btn.show{opacity:1;pointer-events:auto;transform:none}
.musik-btn:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

/* ===== Chat ===== */
.chat-box{max-width:900px;margin:8px auto;background:var(--putih);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 22px;background:linear-gradient(135deg,var(--hijau-muda),var(--hijau-tua));color:#fff}
.chat-head h2{margin:0;color:#fff;font-size:1.2rem}
.chat-head .me{font-size:.85rem}
.chat-head .me b{color:var(--kuning-logo)}
.linkbtn{font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 12px;margin-left:8px}
.linkbtn:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.chat-list{height:min(62vh,520px);overflow-y:auto;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:80%;padding:10px 14px;border-radius:18px 18px 18px 5px;background:var(--putih);border:1px solid var(--border);align-self:flex-start;overflow-wrap:anywhere;animation:pop .25s ease}
.msg.mine{align-self:flex-end;background:var(--hijau);color:#fff;border-color:var(--hijau);border-radius:18px 18px 5px 18px}
.msg .nk{font-size:.78rem;font-weight:700;margin-bottom:1px}
.msg.mine .nk{color:var(--kuning-logo)}
.msg .tx{white-space:pre-wrap}
.msg .tm{font-size:.68rem;opacity:.6;text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
.chat-bar{display:flex;gap:10px;padding:16px;border-top:1px solid var(--border);background:var(--putih)}
.chat-bar input,.nick-form input{flex:1;min-width:0;height:48px;font:inherit;font-size:16px;padding:0 18px;border:2px solid var(--border);border-radius:999px;background:var(--bg);color:var(--teks)}
.chat-bar input:focus,.nick-form input:focus,.gate input:focus{outline:none;border-color:var(--hijau-muda)}
.chat-bar button,.nick-form button,.gate button{font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:999px;height:48px;min-width:90px;padding:0 22px;background:var(--hijau);color:#fff}
.chat-bar button:disabled,.nick-form button:disabled{opacity:.55;cursor:not-allowed}
.chat-bar button:focus-visible,.nick-form button:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.chat-err{min-height:1.4em;padding:0 16px 8px;font-size:.85rem;font-weight:600;color:#d64538;background:var(--putih)}
.chat-note{padding:10px 18px 14px;font-size:.8rem;text-align:center;color:var(--muted);background:var(--putih);border-top:1px solid var(--border)}
.nick-card{max-width:460px;margin:24px auto;background:var(--putih);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md);padding:32px 28px;text-align:center}
.nick-card h2{font-size:1.6rem;margin-bottom:6px}
.nick-card p{margin:0 0 18px;color:var(--muted);font-size:.92rem}
.nick-form{display:flex;gap:8px}
.nick-card .chat-err{padding:8px 0 0;background:transparent;text-align:left}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

:root{--judul:#12291c;color-scheme:only light}

/* ===== Countdown ===== */
.cd{display:flex;gap:10px;overflow-x:auto;margin-top:12px}
.cd:empty{display:none}
.cd-i{flex:1 0 160px;max-width:280px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.cd-l{font-size:.78rem;font-weight:600;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-t{font:800 1.3rem/1.25 "Poppins",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ===== Tugas & info ===== */
.tg{display:grid;gap:10px}
.tgi{background:var(--putih);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.tgi.lewat{opacity:.55}
.tgi .atas{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.jn{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.tw{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.tw.dekat{color:#d9531e}
.tgi h3{margin:2px 0 4px;font:700 1.05rem/1.3 "Poppins",sans-serif;color:var(--judul)}
.tgi p{margin:0;color:var(--muted);white-space:pre-wrap}
.tgi .mp2{font-size:.85rem;color:var(--muted);margin-bottom:2px}

/* ===== Gerbang panel (tanpa menu/tautan) ===== */
.gate{position:fixed;inset:0;z-index:50;background:rgba(8,14,10,.72);display:grid;place-items:center;padding:16px}
.gate form{background:var(--putih);padding:20px;border-radius:18px;width:min(320px,100%);display:grid;gap:10px;box-shadow:var(--shadow-md)}
.gate input{height:48px;font:inherit;font-size:16px;padding:0 16px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--teks)}
.gate .chat-err{padding:0;background:none}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <div class="logo" id="logo"><img src="/assets/logo-180.png" alt="Logo SMP Negeri 1 Gunungputri"></div>
    <div class="brand">
      <p class="sekolah">SMP Negeri 1 Gunungputri</p>
      <h1>VIII.H</h1>
      <p class="sub" id="sub">Memuat data kelas...</p>
    </div>
      </div>
  <div class="wrap">
    <div class="status" id="status" aria-live="polite">Memuat...</div>
    <div class="cd" id="cd"></div>
  </div>
</header>
<div class="accent-bar"></div>
<nav>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Menu">
      <button class="tab" role="tab" id="tab-jadwal" data-tab="jadwal" aria-selected="true" type="button">Jadwal</button>
      <button class="tab" role="tab" id="tab-tugas" data-tab="tugas" aria-selected="false" type="button">Tugas</button>
      <button class="tab" role="tab" id="tab-piket" data-tab="piket" aria-selected="false" type="button">Piket</button>
      <button class="tab" role="tab" id="tab-struktur" data-tab="struktur" aria-selected="false" type="button">Struktur</button>
      <button class="tab" role="tab" id="tab-kenangan" data-tab="kenangan" aria-selected="false" type="button">Kenangan</button>
      <button class="tab" role="tab" id="tab-chat" data-tab="chat" aria-selected="false" type="button">Chat</button>
      <button class="tab" role="tab" id="tab-sosmed" data-tab="sosmed" aria-selected="false" type="button">Sosmed</button>
    </div>
  </div>
</nav>
<main class="wrap" id="konten" role="tabpanel" aria-live="polite"></main>
<button class="musik-btn" id="musik-btn" type="button" aria-hidden="true">Jeda musik</button>
<noscript><div class="wrap"><p>Aktifkan JavaScript untuk melihat jadwal kelas.</p></div></noscript>

<script nonce="__NONCE__">
(function () {
  'use strict';
  var NONCE = (document.currentScript && document.currentScript.nonce) || '';

  var HARI = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
  var DATA = null;
  var state = { tab: 'jadwal', day: 0, filter: 'Semua' };
  var CDS = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function toMin(hhmm) {
    var p = String(hhmm).split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  // Waktu sekarang di WIB, hari: 0=Senin ... 4=Jumat, -1=akhir pekan
  function nowWib() {
    var d;
    try {
      d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
      if (isNaN(d.getTime())) d = new Date();
    } catch (e) {
      d = new Date();
    }
    var g = d.getDay();
    return { hari: g >= 1 && g <= 5 ? g - 1 : -1, menit: d.getHours() * 60 + d.getMinutes() };
  }

  function namaMapel(kode) {
    var m = DATA.mapel[kode];
    return m ? m.nama : kode;
  }

  function updateStatus() {
    var box = document.getElementById('status');
    var t = nowWib();
    if (t.hari === -1) {
      box.textContent = 'Akhir pekan. Pelajaran berikutnya dimulai hari Senin.';
      return;
    }
    var list = DATA.jadwal[HARI[t.hari]] || [];
    var i, s;
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (t.menit >= toMin(s.mulai) && t.menit < toMin(s.selesai)) {
        box.textContent = 'Sekarang: ' + namaMapel(s.kode) + ' (sampai ' + s.selesai + ' WIB)';
        return;
      }
    }
    for (i = 0; i < list.length; i++) {
      s = list[i];
      if (s.kode !== 'ISTIRAHAT' && toMin(s.mulai) > t.menit) {
        box.textContent = 'Berikutnya: ' + namaMapel(s.kode) + ' pukul ' + s.mulai + ' WIB';
        return;
      }
    }
    box.textContent = 'Kegiatan belajar hari ini sudah selesai.';
  }

  function viewJadwal() {
    var box = el('section');
    var today = nowWib();

    var chips = el('div', 'chips');
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', 'Pilih hari');
    HARI.forEach(function (h, i) {
      var cls = 'chip' + (i === state.day ? ' on' : '') + (i === today.hari ? ' today' : '');
      var b = el('button', cls, h);
      b.type = 'button';
      b.setAttribute('aria-pressed', i === state.day ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.day = i;
        render();
      });
      chips.appendChild(b);
    });
    box.appendChild(chips);

    var list = DATA.jadwal[HARI[state.day]] || [];
    if (!list.length) {
      box.appendChild(el('div', 'empty', 'Belum ada jadwal untuk hari ini.'));
      return box;
    }

    list.forEach(function (s) {
      var info = DATA.mapel[s.kode] || { nama: s.kode, warna: '#ffffff' };
      var aktif = today.hari === state.day && today.menit >= toMin(s.mulai) && today.menit < toMin(s.selesai);
      var cls = 'blok' + (s.kode === 'ISTIRAHAT' ? ' rest' : '') + (s.kode === 'KOK' ? ' kok' : '') + (aktif ? ' now' : '');
      var b = el('div', cls);
      if (s.kode !== 'ISTIRAHAT' && s.kode !== 'KOK') {
        b.style.background = info.warna;
        b.style.color = info.teks || '#132018';
      }
      b.appendChild(el('div', 'jam', s.mulai + ' - ' + s.selesai));

      var isi = el('div');
      var judul = el('div', 'mp', info.nama);
      if (s.kode !== 'ISTIRAHAT' && s.kode !== 'KOK' && info.nama !== s.kode) {
        judul.appendChild(el('small', '', s.kode));
      }
      if (aktif) judul.appendChild(el('span', 'badge', 'Berlangsung'));
      isi.appendChild(judul);
      if (s.guru) isi.appendChild(el('div', 'guru', s.guru));
      b.appendChild(isi);
      box.appendChild(b);
    });
    return box;
  }

  function viewPiket() {
    var box = el('section');
    box.appendChild(el('h2', '', 'Jadwal Piket'));
    var grid = el('div', 'grid');
    var t = nowWib();
    HARI.forEach(function (h, i) {
      var card = el('div', 'card' + (i === t.hari ? ' on' : ''));
      var judul = el('h3', '', h);
      if (i === t.hari) judul.appendChild(el('span', 'badge', 'Hari ini'));
      card.appendChild(judul);
      var ol = el('ol');
      (DATA.piket[h] || []).forEach(function (nama) {
        ol.appendChild(el('li', '', nama));
      });
      card.appendChild(ol);
      grid.appendChild(card);
    });
    box.appendChild(grid);
    return box;
  }

  function viewStruktur() {
    var box = el('section');
    var wali = el('div', 'card wali');
    wali.appendChild(el('h3', '', 'Wali Kelas'));
    wali.appendChild(el('div', 'guru', DATA.waliKelas));
    box.appendChild(wali);

    var grid = el('div', 'grid');
    (DATA.struktur || []).forEach(function (r) {
      var card = el('div', 'card');
      card.appendChild(el('h3', '', r.jabatan));
      var ul = el('ul');
      r.anggota.forEach(function (n) {
        ul.appendChild(el('li', '', n));
      });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    box.appendChild(grid);
    return box;
  }

  var FOTO = null;
  var lb = null, lbIdx = 0, lbImg = null, lbInfo = null;

  function lbTampil() {
    lbImg.src = FOTO[lbIdx];
    lbImg.alt = 'Foto kenangan kelas ' + (lbIdx + 1);
    lbInfo.textContent = (lbIdx + 1) + ' / ' + FOTO.length;
  }
  function lbGeser(d) {
    if (!lb || !FOTO.length) return;
    lbIdx = (lbIdx + d + FOTO.length) % FOTO.length;
    lbTampil();
  }
  function lbTutup() {
    if (lb) { lb.remove(); lb = null; }
  }
  function lbBuka(i) {
    lbTutup();
    lbIdx = i;
    lb = el('div', 'lb');
    lb.setAttribute('role', 'dialog');
    lb.setAttribute('aria-modal', 'true');
    lb.setAttribute('aria-label', 'Foto kenangan');
    lbImg = el('img');
    lb.appendChild(lbImg);
    var bar = el('div', 'lb-bar');
    var prev = el('button', 'lbtn', 'Sebelumnya');
    var next = el('button', 'lbtn', 'Berikutnya');
    var tutup = el('button', 'lbtn', 'Tutup');
    lbInfo = el('span');
    [prev, next, tutup].forEach(function (b) { b.type = 'button'; });
    prev.addEventListener('click', function () { lbGeser(-1); });
    next.addEventListener('click', function () { lbGeser(1); });
    tutup.addEventListener('click', lbTutup);
    bar.appendChild(prev); bar.appendChild(lbInfo); bar.appendChild(next); bar.appendChild(tutup);
    lb.appendChild(bar);
    lb.addEventListener('click', function (e) { if (e.target === lb) lbTutup(); });
    document.body.appendChild(lb);
    lbTampil();
    tutup.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (!lb) return;
    if (e.key === 'Escape') lbTutup();
    else if (e.key === 'ArrowRight') lbGeser(1);
    else if (e.key === 'ArrowLeft') lbGeser(-1);
  });

  function viewKenangan() {
    var box = el('section');
    box.appendChild(el('h2', '', 'Foto Kenangan'));
    var isi = el('div');
    box.appendChild(isi);

    function gambar() {
      isi.textContent = '';
      if (!FOTO.length) {
        isi.appendChild(el('div', 'empty', 'Belum ada foto kenangan.'));
        return;
      }
      var g = el('div', 'galeri');
      FOTO.forEach(function (u, i) {
        var b = el('button', 'foto');
        b.type = 'button';
        b.setAttribute('aria-label', 'Buka foto ' + (i + 1));
        var im = el('img');
        im.src = u;
        im.alt = 'Foto kenangan kelas ' + (i + 1);
        im.loading = 'lazy';
        b.appendChild(im);
        b.addEventListener('click', function () { lbBuka(i); });
        g.appendChild(b);
      });
      isi.appendChild(g);
    }

    if (FOTO) { gambar(); return box; }
    isi.appendChild(el('div', 'empty', 'Memuat foto...'));
    fetch('/api/foto', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        FOTO = Array.isArray(d.foto) ? d.foto : [];
        gambar();
      })
      .catch(function () {
        isi.textContent = '';
        var e = el('div', 'error');
        e.appendChild(el('p', '', 'Foto tidak bisa dimuat.'));
        var btn = el('button', 'retry', 'Coba lagi');
        btn.type = 'button';
        btn.addEventListener('click', render);
        e.appendChild(btn);
        isi.appendChild(e);
      });
    return box;
  }

  function viewSosmed() {
    var box = el('section');
    box.appendChild(el('h2', '', 'Media Sosial'));
    var g = el('div', 'sosmed');
    (DATA.sosmed || []).forEach(function (s) {
      if (String(s.url).indexOf('https://') !== 0) return;
      var a = el('a', 'sos');
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.background = s.warna;
      a.style.color = s.teks;
      a.appendChild(el('div', 'nm', s.nama));
      a.appendChild(el('div', 'hd', s.handle));
      a.appendChild(el('div', 'go', 'Buka ' + s.nama));
      g.appendChild(a);
    });
    box.appendChild(g);
    return box;
  }



  // ===== Tugas, ulangan, dan info =====
  var JENIS = { PR: '#b7791f', Ulangan: '#c0392b', Info: '#2f8fd6' };

  function selisihHari(tgl) {
    var n = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
    var p = tgl.split('-');
    return Math.round((Date.UTC(+p[0], p[1] - 1, +p[2]) - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5);
  }

  function viewTugas() {
    var box = el('section');
    var chips = el('div', 'chips');
    ['Semua', 'PR', 'Ulangan', 'Info'].forEach(function (j) {
      var b = el('button', 'chip' + (j === state.filter ? ' on' : ''), j);
      b.type = 'button';
      b.addEventListener('click', function () { state.filter = j; render(); });
      chips.appendChild(b);
    });
    box.appendChild(chips);

    var list = (DATA.pengumuman || []).map(function (p) {
      return { p: p, sisa: p.tenggat ? selisihHari(p.tenggat) : null };
    }).filter(function (x) {
      return (state.filter === 'Semua' || x.p.jenis === state.filter) && (x.sisa === null || x.sisa >= -3);
    }).sort(function (a, b) {
      if (a.sisa === null) return b.sisa === null ? 0 : 1;
      return b.sisa === null ? -1 : a.sisa - b.sisa;
    });
    if (!list.length) {
      box.appendChild(el('div', 'empty', 'Belum ada tugas atau pengumuman.'));
      return box;
    }
    var g = el('div', 'tg');
    list.forEach(function (x) {
      var p = x.p, s = x.sisa;
      var c = el('article', 'tgi' + (s !== null && s < 0 ? ' lewat' : ''));
      c.style.setProperty('--c', JENIS[p.jenis] || JENIS.Info);
      var atas = el('div', 'atas');
      atas.appendChild(el('span', 'jn', p.jenis));
      if (s !== null) {
        var q = p.tenggat.split('-');
        var tgl = new Date(Date.UTC(+q[0], q[1] - 1, +q[2])).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
        var sisa = s < 0 ? 'Lewat ' + (-s) + ' hari' : s === 0 ? 'Hari ini' : s === 1 ? 'Besok' : s + ' hari lagi';
        atas.appendChild(el('span', 'tw' + (s >= 0 && s <= 1 ? ' dekat' : ''), tgl + ' · ' + sisa));
      }
      c.appendChild(atas);
      c.appendChild(el('h3', '', p.judul));
      if (p.mapel) c.appendChild(el('div', 'mp2', p.mapel));
      if (p.isi) c.appendChild(el('p', '', p.isi));
      g.appendChild(c);
    });
    box.appendChild(g);
    return box;
  }

  // ===== Countdown =====
  function cdRender() {
    var box = document.getElementById('cd');
    box.textContent = '';
    CDS = (DATA.countdown || []).filter(function (c) { return c.waktu > Date.now(); }).slice(0, 4);
    CDS.forEach(function (c) {
      var i = el('div', 'cd-i');
      i.appendChild(el('div', 'cd-l', c.label));
      c.node = el('div', 'cd-t');
      i.appendChild(c.node);
      box.appendChild(i);
    });
    cdTick();
  }

  function cdTick() {
    var now = Date.now();
    for (var i = 0; i < CDS.length; i++) {
      var c = CDS[i], s = Math.floor((c.waktu - now) / 1000);
      if (s <= 0) return cdRender();
      var d = Math.floor(s / 86400);
      var p = function (n) { return ('0' + n).slice(-2); };
      c.node.textContent = (d ? d + ' hari ' : '') + p(Math.floor(s % 86400 / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
    }
  }

  // ===== Pintu panel pengelola: tidak ada menu atau tautan, ketuk logo 5x =====
  var taps = [];
  document.getElementById('logo').addEventListener('click', function () {
    var n = Date.now();
    taps = taps.filter(function (t) { return n - t < 4000; });
    taps.push(n);
    if (taps.length >= 5) { taps = []; panelBuka(); }
  });

  function panelMuat(tok) {
    if (window.__adm) return Promise.resolve(window.__adm());
    return fetch('/api/a/ui', { headers: { Authorization: 'Bearer ' + tok } }).then(function (r) {
      if (!r.ok) throw new Error('auth');
      return r.text();
    }).then(function (kode) {
      window.__tok = tok;
      window.__nonce = NONCE;
      var s = document.createElement('script');
      s.nonce = NONCE;
      s.text = kode;
      document.head.appendChild(s);
      s.remove();
    });
  }

  function panelBuka() {
    var tok = null;
    try { tok = sessionStorage.getItem('k8h_t'); } catch (e) {}
    if (!tok) return panelGerbang();
    panelMuat(tok).catch(function () { try { sessionStorage.removeItem('k8h_t'); } catch (e) {} window.__adm = null; panelGerbang(); });
  }

  function panelGerbang() {
    if (document.querySelector('.gate')) return;
    var g = el('div', 'gate');
    var f = el('form');
    var i = el('input');
    i.type = 'password'; i.placeholder = 'Kode'; i.autocomplete = 'off'; i.setAttribute('aria-label', 'Kode');
    var b = el('button', '', 'Masuk');
    b.type = 'submit';
    var err = el('div', 'chat-err');
    f.appendChild(i); f.appendChild(b); f.appendChild(err);
    g.appendChild(f);
    g.addEventListener('click', function (e) { if (e.target === g) g.remove(); });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      b.disabled = true;
      chatPost('/api/a/login', { pass: i.value }).then(function (d) {
        if (!d.token) { b.disabled = false; err.textContent = d.error || 'Gagal.'; return; }
        try { sessionStorage.setItem('k8h_t', d.token); } catch (x) {}
        g.remove();
        panelMuat(d.token).catch(function () {});
      }).catch(function () { b.disabled = false; err.textContent = 'Gagal terhubung.'; });
    });
    document.body.appendChild(g);
    i.focus();
  }

  window.addEventListener('k8h-refresh', function () { load(true); });

  // ===== Community Chat (global) =====
  var CHAT = { ready: false, nick: null, tok: null, aid: 0, msgs: [], es: null, lastId: 0, list: null, errBox: null };

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  function chatLupa() {
    CHAT.nick = null; CHAT.tok = null; CHAT.aid = 0;
    lsDel('k8h_nick'); lsDel('k8h_tok'); lsDel('k8h_aid');
  }

  function chatInit() {
    if (CHAT.ready) return;
    CHAT.ready = true;
    CHAT.nick = lsGet('k8h_nick') || null;
    CHAT.tok = lsGet('k8h_tok') || null;
    CHAT.aid = parseInt(lsGet('k8h_aid') || '0', 10) || 0;
    lsDel('k8h_cid');
    if (!CHAT.nick || !CHAT.tok || !CHAT.aid) chatLupa(); // akun lama tanpa token harus dibuat ulang
  }

  function nickColor(name) {
    var h = 0, i;
    for (i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + h + ',55%,32%)';
  }

  function jamChat(t) {
    try {
      return new Date(t).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' }).replace('.', ':');
    } catch (e) { return ''; }
  }

  function chatPost(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { d.status = r.status; return d; });
      });
  }

  function chatStop() {
    if (CHAT.es) { CHAT.es.close(); CHAT.es = null; }
    CHAT.list = null;
    CHAT.errBox = null;
  }

  function viewNick() {
    var box = el('section');
    var card = el('div', 'nick-card');
    card.appendChild(el('h2', '', 'Community Chat'));
    card.appendChild(el('p', '', 'Masukkan nama tampilan untuk bergabung. Nama ini akan digunakan saat kamu mengirim pesan dan tersimpan di perangkat ini.'));
    card.appendChild(el('p', 'chat-note', 'Alamat IP dicatat otomatis saat kamu membuat akun dan mengirim pesan, hanya untuk keamanan.'));
    var form = el('form', 'nick-form');
    var inp = el('input');
    inp.type = 'text';
    inp.maxLength = 16;
    inp.placeholder = 'Nickname (3-16 karakter)';
    inp.setAttribute('aria-label', 'Nickname');
    inp.autocomplete = 'off';
    var btn = el('button', '', 'Masuk');
    btn.type = 'submit';
    form.appendChild(inp);
    form.appendChild(btn);
    var err = el('div', 'chat-err');
    err.setAttribute('role', 'alert');
    card.appendChild(form);
    card.appendChild(err);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      chatPost('/api/chat/nick', { nick: inp.value })
        .then(function (d) {
          btn.disabled = false;
          if (d.ok && d.token) {
            CHAT.nick = d.nick; CHAT.tok = d.token; CHAT.aid = d.aid;
            lsSet('k8h_nick', d.nick); lsSet('k8h_tok', d.token); lsSet('k8h_aid', String(d.aid));
            render();
          } else {
            err.textContent = d.error || 'Nickname tidak bisa dipakai.';
          }
        })
        .catch(function () {
          btn.disabled = false;
          err.textContent = 'Gagal terhubung ke server.';
        });
    });
    box.appendChild(card);
    setTimeout(function () { inp.focus(); }, 0);
    return box;
  }

  function chatAppend(m) {
    if (!m || m.id <= CHAT.lastId) return;
    CHAT.lastId = m.id;
    CHAT.msgs.push(m);
    if (CHAT.msgs.length > 200) CHAT.msgs.shift();
    if (!CHAT.list) return;
    var kosong = CHAT.list.querySelector('.chat-empty');
    if (kosong) kosong.remove();
    var dekat = CHAT.list.scrollHeight - CHAT.list.scrollTop - CHAT.list.clientHeight < 90;
    var mine = m.aid && m.aid === CHAT.aid;
    var b = el('div', 'msg' + (mine ? ' mine' : ''));
    var nk = el('div', 'nk', m.nick);
    if (!mine) nk.style.color = nickColor(m.nick);
    b.appendChild(nk);
    b.appendChild(el('div', 'tx', m.text));
    b.appendChild(el('div', 'tm', jamChat(m.t)));
    CHAT.list.appendChild(b);
    if (dekat || mine) CHAT.list.scrollTop = CHAT.list.scrollHeight;
  }

  function chatLoadHistory() {
    return fetch('/api/chat/history', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        (d.messages || []).forEach(chatAppend);
        if (CHAT.list && !CHAT.msgs.length && !CHAT.list.querySelector('.chat-empty')) {
          CHAT.list.appendChild(el('div', 'chat-empty', 'Belum ada pesan. Jadilah yang pertama menyapa!'));
        }
        if (CHAT.list) CHAT.list.scrollTop = CHAT.list.scrollHeight;
      });
  }

  function chatConnect() {
    if (CHAT.es || !window.EventSource) return;
    var es = new EventSource('/api/chat/stream');
    es.onmessage = function (ev) {
      try { chatAppend(JSON.parse(ev.data)); } catch (e) {}
    };
    es.onopen = function () { chatLoadHistory().catch(function () {}); };
    CHAT.es = es;
  }

  function viewChatRoom() {
    var box = el('section');
    var wrap = el('div', 'chat-box');

    var head = el('div', 'chat-head');
    head.appendChild(el('h2', '', 'Community Chat'));
    var me = el('div', 'me');
    me.appendChild(document.createTextNode('Kamu: '));
    me.appendChild(el('b', '', CHAT.nick));
    var ganti = el('button', 'linkbtn', 'Ganti nickname');
    ganti.type = 'button';
    ganti.addEventListener('click', function () {
      if (!window.confirm('Ganti nickname? Akun lama akan dihapus.')) return;
      chatPost('/api/chat/leave', { token: CHAT.tok }).catch(function () {});
      chatLupa();
      chatStop();
      CHAT.msgs = [];
      CHAT.lastId = 0;
      render();
    });
    me.appendChild(ganti);
    head.appendChild(me);
    wrap.appendChild(head);

    var list = el('div', 'chat-list');
    list.setAttribute('role', 'log');
    list.setAttribute('aria-live', 'polite');
    list.setAttribute('aria-label', 'Pesan chat');
    wrap.appendChild(list);

    var err = el('div', 'chat-err');
    err.setAttribute('role', 'alert');
    wrap.appendChild(err);

    var bar = el('form', 'chat-bar');
    var inp = el('input');
    inp.type = 'text';
    inp.maxLength = 300;
    inp.placeholder = 'Tulis pesan...';
    inp.setAttribute('aria-label', 'Tulis pesan');
    inp.autocomplete = 'off';
    var kirim = el('button', '', 'Kirim');
    kirim.type = 'submit';
    bar.appendChild(inp);
    bar.appendChild(kirim);
    wrap.appendChild(bar);
    wrap.appendChild(el('div', 'chat-note', 'Ruang obrolan kelas untuk berbagi informasi dan berdiskusi. Gunakan bahasa yang sopan agar nyaman untuk semua anggota. Alamat IP dicatat untuk keamanan.'));
    box.appendChild(wrap);

    CHAT.list = list;
    CHAT.errBox = err;
    // tampilkan ulang pesan yang sudah ada di memori, lalu sinkron dengan server
    var salin = CHAT.msgs.slice();
    CHAT.msgs = [];
    CHAT.lastId = 0;
    salin.forEach(chatAppend);
    chatLoadHistory().catch(function () {
      err.textContent = 'Riwayat chat belum bisa dimuat. Mencoba lagi otomatis...';
    });
    chatConnect();

    bar.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = inp.value.trim();
      if (!text) return;
      err.textContent = '';
      kirim.disabled = true;
      chatPost('/api/chat/send', { token: CHAT.tok, text: text })
        .then(function (d) {
          kirim.disabled = false;
          if (d.ok) {
            inp.value = '';
            inp.focus();
            setTimeout(function () { if (CHAT.lastId < d.id) chatLoadHistory().catch(function () {}); }, 1200);
          } else {
            err.textContent = d.error || 'Pesan gagal dikirim.';
            if (d.ulang) { chatLupa(); chatStop(); render(); }
          }
        })
        .catch(function () {
          kirim.disabled = false;
          err.textContent = 'Gagal terhubung ke server.';
        });
    });

    setTimeout(function () { list.scrollTop = list.scrollHeight; }, 0);
    return box;
  }

  function viewChat() {
    chatInit();
    if (!CHAT.nick) return viewNick();
    return viewChatRoom();
  }

  function render() {
    var main = document.getElementById('konten');
    main.textContent = '';
    if (!DATA) return;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-tab') === state.tab ? 'true' : 'false');
    }
    main.setAttribute('aria-labelledby', 'tab-' + state.tab);
    if (state.tab === 'tugas') main.appendChild(viewTugas());
    else if (state.tab === 'piket') main.appendChild(viewPiket());
    else if (state.tab === 'struktur') main.appendChild(viewStruktur());
    else if (state.tab === 'kenangan') main.appendChild(viewKenangan());
    else if (state.tab === 'chat') main.appendChild(viewChat());
    else if (state.tab === 'sosmed') main.appendChild(viewSosmed());
    else main.appendChild(viewJadwal());
  }

  function showError(msg) {
    var main = document.getElementById('konten');
    main.textContent = '';
    var box = el('div', 'error');
    box.appendChild(el('p', '', msg));
    var btn = el('button', 'retry', 'Coba lagi');
    btn.type = 'button';
    btn.addEventListener('click', function () { load(); });
    box.appendChild(btn);
    main.appendChild(box);
    document.getElementById('status').textContent = 'Data belum dimuat.';
  }

  function load(diam) {
    if (!diam) document.getElementById('status').textContent = 'Memuat...';
    fetch('/api/data', { cache: 'no-cache' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        DATA = d;
        var t = nowWib();
        state.day = t.hari === -1 ? 0 : t.hari;
        document.getElementById('sub').textContent = 'Wali kelas: ' + d.waliKelas;
        document.title = 'Kelas ' + d.kelas + ' - Jadwal, Tugas, dan Piket';
        updateStatus();
        cdRender();
        render();
      })
      .catch(function () {
        if (diam) return;
        showError('Data kelas tidak bisa dimuat. Periksa koneksi lalu coba lagi.');
      });
  }


  // ===== Musik: hanya aktif di tab Kenangan =====
  var MUSIK = { src: '/musik/kenangan.mp3', audio: null };

  function musikSiap() {
    if (MUSIK.audio) return;
    var a = new Audio(MUSIK.src);
    a.loop = true;
    a.preload = 'auto';
    var btn = document.getElementById('musik-btn');
    a.addEventListener('play', function () { btn.textContent = 'Jeda musik'; });
    a.addEventListener('pause', function () { btn.textContent = 'Putar musik'; });
    btn.addEventListener('click', function () {
      if (a.paused) a.play().catch(function () {}); else a.pause();
    });
    MUSIK.audio = a;
  }

  // Dipanggil langsung dari klik tab (gestur pengguna) agar autoplay diizinkan browser
  function musikMulai() {
    musikSiap();
    var btn = document.getElementById('musik-btn');
    btn.classList.add('show');
    btn.setAttribute('aria-hidden', 'false');
    MUSIK.audio.currentTime = 0;
    var p = MUSIK.audio.play();
    if (p && p.catch) p.catch(function () { btn.textContent = 'Putar musik'; });
  }

  function musikBerhenti() {
    var btn = document.getElementById('musik-btn');
    btn.classList.remove('show');
    btn.setAttribute('aria-hidden', 'true');
    if (MUSIK.audio) {
      MUSIK.audio.pause();
      MUSIK.audio.currentTime = 0;
    }
  }

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      state.tab = b.getAttribute('data-tab');
      if (state.tab === 'kenangan') musikMulai(); else musikBerhenti();
      if (state.tab !== 'chat') chatStop();
      render();
    });
  });

  setInterval(function () { if (DATA) cdTick(); }, 1000);
  setInterval(function () {
    if (!DATA) return;
    updateStatus();
    if (state.tab === 'jadwal') render();
  }, 30000);

  load();
})();
</script>
